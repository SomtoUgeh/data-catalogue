[project]
name = "data-catalogue-worker"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "data-catalogue",
    "fastapi==0.156.8",
    "pydantic==2.14.1",
    "pydantic-settings==2.11.0",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]

[tool.uv.sources]
data-catalogue = { path = "../backend" }
