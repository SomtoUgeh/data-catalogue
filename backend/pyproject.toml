[project]
name = "data-catalogue"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.156.8",
    "pydantic==2.14.1",
    "pydantic-settings==2.11.0",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
pretty = true
